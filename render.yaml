# Despliegue en Render (render.com) con un clic: New → Blueprint → elige este repositorio.
services:
  - type: web
    name: humboldtclash
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Base de datos Postgres para guardar puntos, rangos y playlists (por ejemplo Neon, gratis).
      # Render te pedirá el valor: pega la «connection string» de Neon (postgres://...).
      - key: DATABASE_URL
        sync: false
